[package]
name = "sigmaos-workspace"
version = "0.1.0"
edition = "2021"
description = "SigmaOS core workspace manifest and component metadata"
license = "MIT"

[dependencies]
sigmaos_initramfs = { path = "crates/initramfs" }

[workspace]
resolver = "2"
# Core SigmaOS component crates — canonical members of the OS workspace.
# crates/* are symlinks to the independent component repositories
# (one repository per component), unified here for coherent builds.
members = [
    "crates/SigmaOS-kernel",
    "crates/vfs",
    "crates/scheduler",
    "crates/driver_framework",
    "crates/init",
    "crates/posix",
    "crates/sys",
    "crates/initramfs",
    "crates/coreutils",
    "crates/boot_manager",
    "crates/memory_manager",
    "crates/interrupt",
    "crates/allocators",
]
